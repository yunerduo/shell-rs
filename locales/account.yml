# Given to the model when the user has an account. The name is a reference,
# not a required form of address: repeating it is the failure this wording
# avoids.
assistant.instruction.address_user:
  zh-CN: 用户已登录账号（昵称：%{name}）。需要称呼时，最多在开头用一次这个名字；其余时候用「你」，不要重复这个名字，也不要把名字硬塞进每句话。
  en: 'The user is signed in (name: %{name}). If you address them by name, use it at most once at the beginning; otherwise use "you". Do not repeat the name or force it into every sentence.'
