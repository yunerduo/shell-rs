_version: 2

# The optional account. Signed out is the default and the only state
# offline: none of this text may imply that signing in is required.

account.button.tooltip:
  zh-CN: 账号
  en: Account
account.button.label_with_email:
  zh-CN: "%{name}（%{email}）"
  en: "%{name} (%{email})"
account.signed_out:
  zh-CN: 未登录
  en: Not signed in
account.sign_in:
  zh-CN: 登录
  en: Sign in
account.register:
  zh-CN: 注册
  en: Create account
account.settings:
  zh-CN: 账号设置
  en: Account settings
account.sign_out:
  zh-CN: 退出登录
  en: Sign out

account.tab.sign_in:
  zh-CN: 登录
  en: Sign in
account.tab.register:
  zh-CN: 注册
  en: Create account
account.dialog.description:
  zh-CN: 登录后可以同步设置与主机、在其他设备上继续使用。不登录也能使用本机的全部功能。
  en: Sign in to sync settings and hosts across devices. Everything on this computer works without an account.
account.dialog.title:
  zh-CN: 账号
  en: Account
account.dialog.sign_in:
  zh-CN: 登录
  en: Sign in
account.dialog.register:
  zh-CN: 创建账号
  en: Create account

account.field.username:
  zh-CN: 用户名
  en: Username
account.field.password:
  zh-CN: 密码
  en: Password
account.field.new_password:
  zh-CN: 密码（至少 8 位）
  en: Password (at least 8 characters)
account.field.email:
  zh-CN: 邮箱（可选）
  en: Email (optional)
account.field.email_required:
  zh-CN: 邮箱
  en: Email
account.field.phone:
  zh-CN: 手机号（可选）
  en: Phone (optional)
account.field.phone_hint:
  zh-CN: 中国大陆 11 位手机号，先不填也可以。
  en: An 11-digit mainland China mobile number; you can leave it out.
account.field.verification_code:
  zh-CN: 验证码
  en: Verification code
account.field.code_hint:
  zh-CN: 6 位数字，10 分钟内有效。
  en: Six digits, valid for ten minutes.

account.form.username.empty:
  zh-CN: 请输入用户名
  en: Enter a username
account.form.username.short:
  zh-CN: 用户名至少 3 个字符
  en: Use at least 3 characters
account.form.username.long:
  zh-CN: 用户名最多 32 个字符
  en: Use at most 32 characters
account.form.username.plain:
  zh-CN: 用户名只能用字母、数字、下划线和连字符
  en: Use letters, digits, underscores and hyphens only
account.form.password.empty:
  zh-CN: 请输入密码
  en: Enter a password
account.form.password.short:
  zh-CN: 密码至少 8 个字符
  en: Use at least 8 characters
account.form.password.long:
  zh-CN: 密码最多 128 个字符
  en: Use at most 128 characters
account.form.password.classes:
  zh-CN: 密码至少包含字母、数字、符号中的两类
  en: Use at least two of letters, digits and symbols
account.form.password.mismatch:
  zh-CN: 两次输入的密码不一致
  en: The two passwords do not match
account.form.email.invalid:
  zh-CN: 邮箱地址格式不对
  en: That email address is not valid
account.form.email.required:
  zh-CN: 请输入邮箱
  en: Enter your email
account.form.code.empty:
  zh-CN: 请输入验证码
  en: Enter the code
account.form.code.invalid:
  zh-CN: 验证码是 6 位数字
  en: The code is six digits
account.form.phone.invalid:
  zh-CN: 手机号应为 11 位，以 1 开头
  en: Enter an 11-digit mobile number starting with 1

account.button.send_code:
  zh-CN: 发送验证码
  en: Send code
account.button.resend_code:
  zh-CN: 重新发送
  en: Send again
account.button.resend_code_wait:
  zh-CN: "%{seconds} 秒后重发"
  en: Send again in %{seconds}s

# The e-mail verification the registration may ask for, and the codes the
# password reset uses. Four failures, four sentences: wrong, stale, void, and
# the mail server itself.
account.code.sent:
  zh-CN: 验证码已发送，请查收邮件。
  en: The code has been sent; check your email.
account.code.required:
  zh-CN: 注册需要先验证邮箱：获取验证码后填在这里。
  en: "Registration verifies the email first: get a code, then enter it here."
account.code.disabled:
  zh-CN: 服务器现在不要求邮箱验证，直接创建账号即可。
  en: The server no longer requires email verification; create the account as usual.
account.code.too_many:
  zh-CN: 发送太频繁，请稍后再试。
  en: Too many requests. Try again shortly.
account.code.send_failed:
  zh-CN: 验证码邮件没有发出去，请稍后重试。
  en: The code could not be sent. Try again later.
account.code.service_unavailable:
  zh-CN: 邮件服务暂不可用，请联系管理员。
  en: Email is unavailable right now; contact the administrator.
account.code.invalid:
  zh-CN: 验证码不对。
  en: That code is not right.
account.code.expired:
  zh-CN: 验证码已过期，请重新获取。
  en: That code has expired; send a new one.
account.code.locked:
  zh-CN: 验证码输错次数太多，请重新获取。
  en: Too many wrong codes; send a new one.
account.code.registered:
  zh-CN: 该邮箱已注册，请直接登录。
  en: That email already has an account. Sign in instead.

# 忘记密码: the same two steps whether or not the address has an account.
account.forgot.link:
  zh-CN: 忘记密码？
  en: Forgot password?
account.forgot.description:
  zh-CN: 用账号的邮箱找回密码。先获取验证码，再设置新密码。
  en: Reset the password with the account's email. Get a code first, then choose a new password.
account.forgot.sent:
  zh-CN: 如果该邮箱已注册，验证码已发送。输入验证码和新密码即可。
  en: If that email has an account, a code has been sent. Enter it with a new password.
account.forgot.reset:
  zh-CN: 重置密码
  en: Reset password
account.forgot.back:
  zh-CN: 返回登录
  en: Back to sign in
account.forgot.change_email:
  zh-CN: 换一个邮箱
  en: Use another email
account.forgot.done:
  zh-CN: 密码已重置，请用新密码登录。
  en: The password was reset. Sign in with the new one.

# 修改密码: the current password or a code mailed to the account. Either way
# every session ends, this computer's included.
account.change_password.title:
  zh-CN: 修改密码
  en: Change password
account.change_password.description_current:
  zh-CN: 输入当前密码和新密码。改完后所有设备都要重新登录，云端同步也需要用新密码重新上传。
  en: Enter your current password and a new one. Every device will have to sign in again, and cloud sync has to be uploaded again with the new password.
account.change_password.description_email:
  zh-CN: 用账号邮箱收验证码，再设置新密码。改完后所有设备都要重新登录，云端同步也需要用新密码重新上传。
  en: Get a code at the account's email, then choose a new password. Every device will have to sign in again, and cloud sync has to be uploaded again with the new password.
account.change_password.mode_current:
  zh-CN: 用当前密码
  en: Current password
account.change_password.mode_email:
  zh-CN: 邮箱验证码
  en: Email code
account.change_password.current:
  zh-CN: 当前密码
  en: Current password
account.change_password.new:
  zh-CN: 新密码
  en: New password
account.change_password.repeat:
  zh-CN: 确认新密码
  en: Repeat new password
account.change_password.commit:
  zh-CN: 修改密码
  en: Change password
account.change_password.email_hint:
  zh-CN: 验证码会发送到 %{email}，10 分钟内有效。
  en: The code goes to %{email} and lasts ten minutes.
account.change_password.no_email:
  zh-CN: 账号还没有邮箱，先用当前密码修改。
  en: The account has no email yet; use the current password instead.
account.change_password.wrong_current:
  zh-CN: 当前密码不对。
  en: That is not your current password.

# 修改邮箱: the code goes to the new address; the session is untouched.
account.change_email.title:
  zh-CN: 修改邮箱
  en: Change email
account.change_email.description:
  zh-CN: 先给新邮箱发验证码，验证通过才换成新邮箱。换完当前设备和其他设备都不用重新登录，其他设备重启后会显示新邮箱。
  en: Send a code to the new address and enter it to switch. You stay signed in, and so do your other devices; they show the new address after a restart.
account.change_email.field:
  zh-CN: 新邮箱
  en: New email
account.change_email.commit:
  zh-CN: 修改邮箱
  en: Change email
account.change_email.hint:
  zh-CN: 验证码会发送到这个新邮箱，10 分钟内有效。
  en: The code goes to this new address and lasts ten minutes.
account.change_email.same:
  zh-CN: 新邮箱与当前邮箱相同。
  en: That is already your email address.
account.change_email.taken:
  zh-CN: 该邮箱已被其他账号使用。
  en: That email address is already in use.
account.change_email.code_stale:
  zh-CN: 邮箱改过了，请先获取验证码。
  en: The address changed; get a new code first.
account.change_email.code_sent:
  zh-CN: 验证码已发送到新邮箱，请查收。
  en: The code has been sent to the new address.

account.popover.signed_out_hint:
  zh-CN: 登录后可同步设置与主机。本机功能不受影响。
  en: Sign in to sync settings and hosts. Local features stay as they are.
account.popover.cloud_on:
  zh-CN: 云同步已开启
  en: Cloud sync on
account.popover.cloud_off:
  zh-CN: 云同步已关闭
  en: Cloud sync off

account.notice.expired:
  zh-CN: 登录已失效，请重新登录。本地功能不受影响。
  en: Your sign-in has expired. Sign in again when you want to sync; local features are unaffected.
account.notice.unreachable:
  zh-CN: 暂时连不上服务器，已按未登录使用。
  en: The server cannot be reached right now, so ShellAs is working as signed out.

account.error.network:
  zh-CN: 网络不可用，请检查网络或代理。
  en: Network unavailable. Check the connection or proxy.
account.error.expired:
  zh-CN: 登录已失效，请重新登录。
  en: Your sign-in has expired. Sign in again.
account.error.credentials:
  zh-CN: 用户名或密码不对。
  en: Wrong username or password.
account.error.disabled:
  zh-CN: 这个账号已被停用。
  en: This account is disabled.
account.error.too_many:
  zh-CN: 尝试次数太多，请稍后再试。
  en: Too many attempts. Try again later.
account.error.too_large:
  zh-CN: 云端空间不够了。
  en: The cloud quota is full.
account.error.quota:
  zh-CN: 云端空间不够了（已用 %{used}，共 %{quota}）。
  en: The cloud quota is full (%{used} used of %{quota}).
account.error.server:
  zh-CN: 服务器出了点问题，请稍后再试。
  en: The server had a problem. Try again later.
account.error.conflict:
  zh-CN: 云端已有更新的版本。
  en: The cloud has a newer version.
account.error.cloud_conflict:
  zh-CN: 云端已有更新的版本，请打开账号设置处理。
  en: The cloud has a newer version; open account settings to choose.
account.error.not_supported:
  zh-CN: 服务器暂不支持这个操作。
  en: The server does not support this yet.
account.error.avatar_format:
  zh-CN: 服务器不接受这个图片格式，请换一张。
  en: The server does not accept this picture's format. Choose another one.

account.avatar.prompt:
  zh-CN: 选择头像
  en: Choose a picture
account.avatar.failed:
  zh-CN: 头像没有换成：%{error}
  en: "The picture could not be used: %{error}"
account.avatar.too_large:
  zh-CN: 头像不能超过 2 MB，请换一张。
  en: The picture must be at most 2 MB. Choose another one.
account.avatar.unsupported_format:
  zh-CN: 头像只支持 PNG、JPEG 或 WebP 格式。
  en: The picture must be PNG, JPEG or WebP.
account.avatar.crop_title:
  zh-CN: 裁剪头像
  en: Crop the picture
account.avatar.crop_hint:
  zh-CN: 拖动图片调整位置，用滑块缩放。圆形以外的部分不会显示。
  en: Drag the picture to move it, and use the slider to zoom. What is outside the circle is left out.
account.avatar.crop_zoom:
  zh-CN: 缩放
  en: Zoom
account.avatar.crop_save:
  zh-CN: 保存头像
  en: Save picture
account.avatar.crop_loading:
  zh-CN: 正在读取图片…
  en: Reading the picture…
account.avatar.crop_too_big:
  zh-CN: 这张图片太大了，请换一张。
  en: This picture is too large. Choose another one.
account.avatar.crop_unreadable:
  zh-CN: 这张图片打不开，请换一张。
  en: This picture could not be opened. Choose another one.

account.kind.settings:
  zh-CN: 设置
  en: settings
account.kind.hosts:
  zh-CN: 主机
  en: hosts
account.notify.uploaded:
  zh-CN: 已同步到云端
  en: Synced to the cloud
account.notify.upload.item:
  zh-CN: "%{kind}：%{state}"
  en: "%{kind}: %{state}"
account.notify.upload.ok:
  zh-CN: 已同步
  en: synced
account.notify.upload.failed:
  zh-CN: 失败（%{error}）
  en: "failed (%{error})"
account.notify.upload.join:
  zh-CN: "%{first}；%{second}"
  en: "%{first}; %{second}"
account.notify.settings_downloaded:
  zh-CN: 已应用云端的设置。
  en: The cloud settings are now in use.
account.notify.hosts_downloaded:
  zh-CN: 云端主机列表已保存到 %{path}，可在这里查看。
  en: The cloud hosts were saved to %{path} for review.
account.notify.phone_not_applied:
  zh-CN: 账号已创建，但手机号暂未生效。可以之后再补。
  en: The account was created, but the phone number did not take effect. You can add it later.
account.notify.password_changed:
  zh-CN: 密码已修改，所有设备都需要重新登录；云端同步需要用新密码重新上传。
  en: The password was changed. Every device has to sign in again, and cloud sync has to be uploaded again with the new password.
account.notify.email_changed:
  zh-CN: 邮箱已改为 %{email}。
  en: The email address is now %{email}.
account.notify.nickname_failed:
  zh-CN: 昵称没有改成功：%{error}
  en: "The nickname was not changed: %{error}"
account.notify.avatar_failed:
  zh-CN: 头像没有换成功：%{error}
  en: "The picture was not changed: %{error}"
account.notify.avatar_removal_failed:
  zh-CN: 头像没有删掉：%{error}
  en: "The picture was not removed: %{error}"

account.conflict.title:
  zh-CN: 云端有更新的版本
  en: A newer version is in the cloud
account.conflict.description:
  zh-CN: 云端已有更新的%{kind}。要用哪一份？
  en: The cloud already has a newer %{kind}. Which one should be kept?
account.conflict.later:
  zh-CN: 稍后处理
  en: Later
account.conflict.download:
  zh-CN: 下载云端版本
  en: Download the cloud version
account.conflict.overwrite:
  zh-CN: 以本机覆盖云端
  en: Overwrite the cloud with this computer

account.sync_password.title:
  zh-CN: 输入同步密码
  en: Enter the sync password
account.sync_password.description:
  zh-CN: 同步内容用账号密码加密。为了继续上传，请再输入一次账号密码。
  en: Synced documents are encrypted with your account password. Enter it once more to continue the upload.
account.sync_password.commit:
  zh-CN: 继续
  en: Continue

# 设置 › 账号
settings.category.account:
  zh-CN: 账号
  en: Account
settings.account.signed_out:
  zh-CN: 未登录
  en: Not signed in
settings.account.signed_out_description:
  zh-CN: 登录只用于同步设置与主机、跨设备使用。主机、终端、SFTP、AI 助手和设置都不用登录。
  en: An account is only for syncing settings and hosts across devices. Hosts, terminals, SFTP, the assistant and settings need no account.
settings.account.local_first:
  zh-CN: 本地优先
  en: Local first
settings.account.local_first_description:
  zh-CN: 未登录、离线或内网环境下，本机功能全部可用，不会要求登录。
  en: Signed out, offline, or on an intranet, everything on this computer works and nothing asks you to sign in.
settings.account.notice:
  zh-CN: 账号状态
  en: Account status
settings.account.group.account:
  zh-CN: 账号
  en: Account
settings.account.avatar:
  zh-CN: 头像
  en: Picture
settings.account.change_avatar:
  zh-CN: 更换头像…
  en: Change picture…
settings.account.remove_avatar:
  zh-CN: 删除头像
  en: Remove picture
settings.account.avatar_description:
  zh-CN: 没上传时会用邮箱头像，再没有就用名称首字母。
  en: Without an upload the picture comes from your e-mail address, and failing that from the initial of your name.
settings.account.email_avatar:
  zh-CN: 使用邮箱头像
  en: Use the mailbox picture
settings.account.email_avatar_description:
  zh-CN: 按邮箱从头像服务取图。关掉后不会发出请求，只用名称首字母。
  en: Ask the avatar service for your e-mail address's picture. Turned off, no request is sent and the initial is used.
settings.account.nickname:
  zh-CN: 昵称
  en: Nickname
settings.account.nickname_empty:
  zh-CN: 未设置
  en: Not set
settings.account.nickname_description:
  zh-CN: 最多 24 个字符。AI 助手知道你的昵称，需要时才会称呼你。
  en: Up to 24 characters. The assistant knows your nickname and uses it only when it fits.
settings.account.edit_nickname:
  zh-CN: 修改…
  en: Edit…
settings.account.nickname_title:
  zh-CN: 修改昵称
  en: Edit nickname
settings.account.save_nickname:
  zh-CN: 保存
  en: Save
settings.account.nickname_too_long:
  zh-CN: 昵称最多 24 个字符
  en: Use at most 24 characters
settings.account.username:
  zh-CN: 用户名
  en: Username
settings.account.email:
  zh-CN: 邮箱
  en: Email
settings.account.email_empty:
  zh-CN: 未设置
  en: Not set
settings.account.email_description:
  zh-CN: 用于找回账号。
  en: Used to recover the account.
settings.account.password:
  zh-CN: 密码
  en: Password
settings.account.change_password:
  zh-CN: 修改…
  en: Change…
settings.account.change_email:
  zh-CN: 修改邮箱
  en: Change email
settings.account.password_description:
  zh-CN: 用当前密码或邮箱验证码修改，改完所有设备都要重新登录。
  en: Change it with the current password or an emailed code; every device then has to sign in again.
settings.account.group.cloud:
  zh-CN: 云同步
  en: Cloud sync
settings.account.cloud_sync:
  zh-CN: 同步设置与主机
  en: Sync settings and hosts
settings.account.cloud_sync_description:
  zh-CN: 上传到云端，并在其他登录同一账号的设备上使用。
  en: Upload here and use them on other devices signed in to the same account.
settings.account.remember_password:
  zh-CN: 记住同步密码
  en: Remember the sync password
settings.account.remember_password_description:
  zh-CN: 下次启动后自动继续同步。密码保存在系统钥匙串。
  en: Keep syncing after a restart. The password is kept in the system keychain.
settings.account.sync_now:
  zh-CN: 立即同步
  en: Sync now
settings.account.sync_now_description:
  zh-CN: 用本机的设置与主机更新云端。
  en: Update the cloud with this computer's settings and hosts.
settings.account.group.sync_content:
  zh-CN: 同步内容
  en: What syncs
settings.account.sync_content_summary:
  zh-CN: 包含界面、终端、SFTP、通知、窗口与应用锁、隐私、AI 助手等软件设置。主机与凭据始终同步，不受这个开关影响。
  en: Covers software settings such as the interface, terminal, SFTP, notifications, window and app lock, privacy and the AI assistant. Hosts and credentials always sync, whatever this switch says.
settings.account.sync_config:
  zh-CN: 同步软件配置
  en: Sync software settings
settings.account.sync_config_on:
  zh-CN: 已选择 %{count} 组
  en: "%{count} selected"
settings.account.sync_config_off:
  zh-CN: 已关闭：只同步主机与凭据，勾选保留
  en: "Off: only hosts and credentials sync; your choices are kept"
settings.account.choose_sync_content:
  zh-CN: 选择同步内容
  en: Choose what syncs
settings.account.sync_content_title:
  zh-CN: 选择同步内容
  en: Choose what syncs
settings.account.sync_content_description:
  zh-CN: 只上传勾选的项。同步连接信息、背景图和这份勾选本身不会上传。
  en: Only the groups you check are uploaded. The sync connection, background pictures and this choice itself never leave this computer.
settings.account.sync_section.appearance:
  zh-CN: 外观与主题
  en: Appearance and theme
settings.account.sync_section.appearance_description:
  zh-CN: 语言、明暗模式、界面字号、终端主题。
  en: Language, light or dark, interface size, terminal theme.
settings.account.sync_section.terminal_font:
  zh-CN: 终端字体
