  en: Not synced yet
settings.account.sync_off:
  zh-CN: 云同步已关闭
  en: Cloud sync is off

# Given to the model when the user has an account, instead of 「你」.
assistant.instruction.address_user:
  zh-CN: 用户已登录账号，昵称是%{name}。用「%{name}」称呼用户，不要用「你」。
  en: The user is signed in; their name is %{name}. Address them as %{name} instead of "you".
