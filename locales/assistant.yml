  en: The request timed out
assistant.error.cancelled:
  zh-CN: 已取消
  en: Cancelled
assistant.error.key_missing:
  zh-CN: 还没有保存 API Key
  en: No API key has been saved yet
assistant.error.keychain:
  zh-CN: 读取系统钥匙串失败：%{reason}
  en: "The system keychain could not be read: %{reason}"
assistant.error.server:
  zh-CN: 服务返回错误：%{reason}
  en: "The service returned an error: %{reason}"
assistant.error.protocol:
  zh-CN: 响应格式无法识别
