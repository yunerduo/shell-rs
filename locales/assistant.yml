  en: Changes the network or the firewall
assistant.rule.resource_delete:
  zh-CN: 删除服务或集群资源
  en: Removes a service or a cluster resource
assistant.rule.power:
  zh-CN: 关机或重启
  en: Shuts down or restarts
assistant.rule.pipe:
