assistant.rule.builtin_blacklist:
  zh-CN: 命中内置黑名单：%{entry}
  en: "Matched the built-in blacklist: %{entry}"
assistant.rule.interactive:
  zh-CN: 交互式命令，无终端时无法控制
  en: An interactive command cannot be driven without a terminal
assistant.rule.destructive:
  zh-CN: 可能破坏数据或设备
  en: May destroy data or a device
assistant.rule.remote_code:
  zh-CN: 下载后直接执行远端代码
  en: Runs code downloaded from elsewhere
assistant.rule.privilege:
  zh-CN: 提权执行
  en: Runs with elevated privilege
assistant.rule.recursive_delete:
  zh-CN: 递归删除绝对路径或通配范围
  en: A recursive delete over a path or wildcard range
assistant.rule.package_change:
  zh-CN: 安装、升级或卸载软件包
  en: Installs, upgrades or removes packages
assistant.rule.network_change:
