  en: "%{shell} is not supported; use a normal execution or run it by hand"
assistant.tool.reason.too_long:
  zh-CN: 命令超过 %{limit} 字节，未输入
  en: The command is over %{limit} bytes and was not typed
assistant.tool.reason.full_screen:
  zh-CN: 终端被全屏程序占用
  en: A full-screen program holds the terminal
assistant.tool.reason.transfer:
  zh-CN: 终端正在传输文件
  en: A file transfer is running in the terminal
assistant.tool.reason.another_run:
  zh-CN: 终端上已有另一个执行
  en: Another run already holds the terminal
assistant.tool.reason.not_started:
  zh-CN: 命令未能启动
  en: The command did not start
assistant.tool.reason.no_answer:
  zh-CN: 这个 shell 不受支持或终端没有回应；请改用常规执行或手动执行
  en: This shell is not supported or the terminal did not answer; use a normal execution or run it by hand
assistant.tool.reason.disconnected:
  zh-CN: 连接已断开，命令可能已部分执行
  en: The connection closed; the command may have run in part
assistant.tool.reason.no_channel:
  zh-CN: 这个终端既不能旁路执行，也不能注入
  en: No channel can run a command on this terminal
assistant.tool.takeover:
  zh-CN: 允许发送 ^C 并接管终端（命令会输入到终端的输入行）
  en: Let it send ^C and take the terminal over (the command is typed into the shell)
assistant.tool.takeover.required:
  zh-CN: 这条命令只能在终端里执行，先勾选接管授权
  en: This command can only run in the terminal; authorize the takeover first
assistant.tool.takeover_closed:
  zh-CN: 你接管了 %{alias}，已停止注入
  en: "You took %{alias} back; the injection was stopped"
assistant.tool.waiting_for:
  zh-CN: 等待 %{alias} 出现「%{pattern}」
  en: "Waiting on %{alias} for \"%{pattern}\""
assistant.tool.wait_hit:
  zh-CN: 等到输出
  en: Output appeared
assistant.tool.wait_timeout:
  zh-CN: 等待超时
  en: Timed out waiting
assistant.tool.echo_possible:
  zh-CN: 可能命中的是命令回声
  en: The match may be the command's echo
assistant.tool.reason.unknown_terminal_list:
  zh-CN: 没有这个别名；可用别名：%{aliases}
  en: "No bound terminal has that alias; available: %{aliases}"
assistant.tool.reason.wait_busy:
  zh-CN: 这个终端已经有一个等待在看了
  en: A wait is already watching this terminal
assistant.tool.reason.background_running:
  zh-CN: 这个终端有后台命令在跑，先停掉它再执行
  en: A background command holds this terminal; stop it first
assistant.tool.reason.user_takeover:
  zh-CN: 你接管了终端
  en: You took the terminal back
assistant.terminals.limit:
  zh-CN: 一次最多绑定 %{limit} 个终端
  en: At most %{limit} terminals can be bound at once
assistant.terminals.pending:
  zh-CN: "%{alias} · 待重绑"
  en: "%{alias} · rebind"
assistant.terminals.pending_hint:
  zh-CN: 上次绑定的 %{title} 这次没能唯一匹配；点击忽略
  en: "The %{title} bound last time could not be told apart; click to dismiss"
assistant.terminals.save_failed:
  zh-CN: 绑定没有保存成功：%{reason}
  en: "The bindings could not be saved: %{reason}"
assistant.tool.background:
  zh-CN: 后台运行：命令启动后立即返回
  en: "Background: returns once the command is running"
assistant.tool.background_started:
  zh-CN: 已在后台启动
  en: Started in the background
assistant.tool.background_list:
  zh-CN: 后台运行中的命令
  en: Commands running in the background
assistant.tool.background_stopped:
  zh-CN: 已停止 %{alias} 的后台命令
  en: "Stopped the background command on %{alias}"
assistant.tool.channel_terminal:
  zh-CN: 终端注入
  en: Terminal injection
assistant.tool.busy:
  zh-CN: 终端正忙
  en: The terminal is busy
assistant.tool.unknown:
  zh-CN: 执行结果未知
  en: The outcome is unknown
assistant.tool.may_have_run:
  zh-CN: 命令可能已部分执行，未自动重试
  en: The command may have run in part; it was not retried
assistant.tool.cancelled_user:
  zh-CN: 你接管了终端
  en: You took the terminal back
assistant.tool.cancelled_stop:
  zh-CN: 已手动停止
  en: Stopped by hand
assistant.action.copy:
  zh-CN: 复制 Markdown
  en: Copy Markdown
assistant.action.copied:
  zh-CN: 已复制
  en: Copied
assistant.action.settings:
  zh-CN: 模型设置
  en: Model settings
assistant.action.send:
  zh-CN: 发送
  en: Send
assistant.action.stop:
  zh-CN: 停止
  en: Stop
assistant.action.save:
  zh-CN: 保存
  en: Save
assistant.settings.protocol:
  zh-CN: 协议
  en: Protocol
assistant.settings.protocol.openai:
  zh-CN: OpenAI 兼容
  en: OpenAI compatible
assistant.settings.protocol.anthropic:
  zh-CN: Anthropic 兼容
  en: Anthropic compatible
assistant.settings.base_url.placeholder:
  zh-CN: 接口地址，例如 https://api.openai.com/v1
  en: "Base URL, for example https://api.openai.com/v1"
assistant.settings.model.placeholder:
  zh-CN: 模型名
  en: Model name
assistant.settings.api_key.placeholder:
  zh-CN: API Key（只写入系统钥匙串）
  en: API key (kept in the system keychain)
assistant.settings.hint:
  zh-CN: Key 不进配置文件，也不写日志；留空则沿用已保存的 Key。
  en: The key never goes in the settings file or the logs; leave it blank to keep the saved one.
assistant.settings.key_saved:
  zh-CN: Key 已存入系统钥匙串
  en: The key is in the system keychain
assistant.settings.key_kept:
  zh-CN: 未填写新 Key，沿用已保存的 Key
  en: No new key was typed; the saved one is kept
assistant.settings.key_failed:
  zh-CN: 保存 Key 失败：%{error}
  en: "The key could not be saved: %{error}"
assistant.settings.blacklist.title:
  zh-CN: 命令黑名单
  en: Command blacklist
assistant.settings.blacklist.hint:
  zh-CN: 命中的命令一律拒绝；参数位置可以用 * 通配。
  en: A matching command is always refused; an argument may use * as a wildcard.
assistant.settings.blacklist.placeholder:
  zh-CN: 例如 systemctl stop *
  en: "For example systemctl stop *"
assistant.settings.whitelist.title:
  zh-CN: 只读白名单
  en: Read-only whitelist
assistant.settings.whitelist.hint:
  zh-CN: 只对单条只读命令生效，命中时不再弹确认。
  en: Applies to one plain read-only command, which then needs no card.
assistant.settings.whitelist.placeholder:
  zh-CN: 例如 df -h
  en: "For example df -h"
assistant.settings.list.add:
  zh-CN: 添加
  en: Add
assistant.settings.list.remove:
  zh-CN: 删除
  en: Remove
assistant.settings.list.invalid:
  zh-CN: 这一条无法加入：只允许单条命令，不能带重定向或替换
  en: This entry cannot be added; it must be one plain command, with no redirect or substitution
assistant.settings.list.empty:
  zh-CN: 还没有条目
  en: No entries yet
assistant.error.no_terminal:
  zh-CN: 先在顶部绑定一个终端
  en: Bind a terminal at the top first
assistant.error.no_provider:
  zh-CN: 先在设置里填写接口地址与模型
