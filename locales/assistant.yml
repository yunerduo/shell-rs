  zh-CN: 不认识这个工具
  en: Unknown tool
assistant.tool.reason.bad_arguments:
  zh-CN: 工具参数无法解析
  en: The tool arguments could not be read
assistant.tool.reason.unknown_terminal:
  zh-CN: 模型指定的终端不在绑定里
  en: The named terminal is not bound
