_version: 2

# The AI assistant: its panel, its provider settings, and what it says when
# a call fails. The key itself is never a string here.

tools.kind.assistant:
  zh-CN: AI 助手
  en: Assistant
settings.sidebar_tools.assistant:
  zh-CN: 与模型对话，按命令策略在已绑定的终端上执行。
  en: Talk to a model and run commands on the bound terminals, under your command policy.
assistant.title:
  zh-CN: AI 助手
  en: Assistant
assistant.terminals.label:
  zh-CN: 终端：
  en: "Terminals:"
