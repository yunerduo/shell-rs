assistant.tool.failed:
  zh-CN: 执行出错
  en: The call failed
assistant.tool.result:
  zh-CN: 结果
  en: Result
assistant.tool.no_output:
  zh-CN: 没有输出
  en: No output
assistant.tool.timed_out:
  zh-CN: 超时
  en: Timed out
