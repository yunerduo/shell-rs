[package]
name = "shellas-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Agree ShellAs 的官网、自建更新与端到端加密云同步服务"

# 独立于仓库根 workspace：自己的锁文件、自己的发布节奏。
# 部署见同目录 README.md。

[dependencies]
anyhow = "1"
# 登录口令只存 Argon2id 的 PHC 串。
argon2 = "0.6"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "rustls-native-certs", "hostname"] }
# 发布子命令在本地给清单签名，私钥不经过服务器。
minisign = "0.7"
# 更新日志页渲染 CHANGELOG 里截出来的 Markdown。
pulldown-cmark = "0.13"
rand = "0.9"
# 发布子命令把安装包和清单推到服务器。
reqwest = { version = "0.13", features = ["blocking", "json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
# 快照下载用流式响应，不把整个文件读进内存。
tokio-util = { version = "0.7", features = ["io"] }
# Range 请求由 ServeDir 处理，客户端断点续传靠它。
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
