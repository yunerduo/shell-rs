# 1Panel 里用：反代到 127.0.0.1:8080，数据在 ./data。
# 管理员令牌与后台账号写在同目录的 .env 里：
#   SHELLAS_ADMIN_TOKEN=...         发布命令行用
#   SHELLAS_ADMIN_USER=...          首次启动创建后台 owner
#   SHELLAS_ADMIN_PASSWORD=...
#   SHELLAS_MINISIGN_KEY_PASSWORD=...  可选，签名私钥带口令时设置
services:
  shellas:
    build: .
    image: shellas-server:latest
    container_name: shellas
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SHELLAS_BIND: 0.0.0.0:8080
      SHELLAS_DATA_DIR: /data
      SHELLAS_PUBLIC_URL: https://shellas.agree.host
      SHELLAS_ADMIN_TOKEN: ${SHELLAS_ADMIN_TOKEN:?在 .env 里设置 SHELLAS_ADMIN_TOKEN}
      SHELLAS_ADMIN_USER: ${SHELLAS_ADMIN_USER:?在 .env 里设置后台管理员账号}
      SHELLAS_ADMIN_PASSWORD: ${SHELLAS_ADMIN_PASSWORD:?在 .env 里设置后台管理员口令}
      SHELLAS_ADMIN_SESSION_DAYS: "7"
      # 私钥放在数据卷里；没有这个文件时后台发布会被拒绝，命令行 publish 不受影响。
      SHELLAS_MINISIGN_KEY: /data/update.key
      SHELLAS_MINISIGN_KEY_PASSWORD: ${SHELLAS_MINISIGN_KEY_PASSWORD:-}
      SHELLAS_ADMIN_UI_DIR: /app/admin-ui
      SHELLAS_DEFAULT_QUOTA_MB: "50"
      SHELLAS_MAX_SNAPSHOTS: "20"
      SHELLAS_SESSION_DAYS: "30"
      # 登录失败锁定：用户与管理员各自计数，互不影响。
      SHELLAS_LOGIN_MAX_FAILURES: "${SHELLAS_LOGIN_MAX_FAILURES:-5}"
      SHELLAS_LOGIN_LOCK_MINUTES: "${SHELLAS_LOGIN_LOCK_MINUTES:-15}"
    volumes:
      - ./data:/data
