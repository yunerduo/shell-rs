# 1Panel 里用：反代到 127.0.0.1:8080，数据在 ./data。
# 管理员令牌写在同目录的 .env 里：SHELLAS_ADMIN_TOKEN=...
services:
  shellas:
    build: .
    image: shellas-server:latest
    container_name: shellas
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SHELLAS_BIND: 0.0.0.0:8080
      SHELLAS_DATA_DIR: /data
      SHELLAS_PUBLIC_URL: https://shellas.agree.host
      SHELLAS_ADMIN_TOKEN: ${SHELLAS_ADMIN_TOKEN:?在 .env 里设置 SHELLAS_ADMIN_TOKEN}
      SHELLAS_DEFAULT_QUOTA_MB: "50"
      SHELLAS_MAX_SNAPSHOTS: "20"
      SHELLAS_SESSION_DAYS: "30"
    volumes:
      - ./data:/data
